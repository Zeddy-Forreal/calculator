<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style/main.css">
    <link rel="icon" href="static/icon.png">

</head>
<body>
    <section class="container">
        <div class="result-field">
            <div class="history"></div>
            <input type="text" id="result">
        </div>
        <hr>
        <div class="buttons">
            <button class="clear sp">C</button>
            <button>(</button>
            <button>)</button>
            <button class="operator sp">&divide;</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator sp">&times;</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator sp">+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator sp">-</button>


            <button>0</button>
            <button>.</button>
            <button class="submit">=</button>
        </div>
    </section>
    <script src="script/main.js"></script>
</body>
</html>
