<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>OtakuHub</title>
    <link rel="stylesheet" href="style/webfonts/all.min.css">
    <link rel="stylesheet" href="style/webfonts/fontawesome.min.css">
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="static/Font/font.css">
    <link rel="icon" href="static/ST_brand/icon.png">

</head>
<body>
    <section class="container">
        <input type="text">

        <div class="buttons">
            <button>(</button>
            <button>)</button>
            <button class="clear">C</button>
            <button class="operator">&divide;</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">&times;</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">-</button>


            <button>0</button>
            <button>.</button>
            <button class="submit">=</button>
        </div>
    </section>
    <script src="javascript/main.js"></script>
</body>
</html>
